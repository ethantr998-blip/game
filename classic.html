<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Trạm Phóng K20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-height launch console — live canvas stage + engineering control panel (stacked on phones) */
:root{
  --bg:#090d17; --panel:#0f1526; --raise:#161e35; --line:#263150; --fg:#e8ecf5; --muted:#8e9aba;
  --amber:#ffad38; --amber-ink:#1d1305; --cyan:#6cd4e8; --good:#5ccf8a; --warn:#ffc94a; --crit:#ff6159;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "stage panel"}
.top{grid-area:top;display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(160deg,#ffcf7a,#ff7a1a 60%,#b8320c);position:relative;flex:none;box-shadow:0 0 18px rgba(255,140,40,.35)}
.brand .mark::after{content:"";position:absolute;left:12px;top:5px;width:6px;height:17px;border-radius:3px 3px 1px 1px;background:#1a1206}
.brand b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:11.5px;letter-spacing:.02em}
.steps{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.steps button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raise);padding:6px 11px;border-radius:8px;cursor:pointer;font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.04em;white-space:nowrap;color:var(--muted)}
.steps button i{font-style:normal;font-family:var(--mono);font-size:11px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--fg)}
.steps button.on{color:var(--amber-ink);background:var(--amber);border-color:var(--amber)}
.steps button.on i{background:rgba(0,0,0,.18);color:var(--amber-ink)}
.steps button:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--raise);width:36px;height:36px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px}
#gfx{width:auto;padding:0 9px;font:700 11px var(--mono);letter-spacing:.03em;color:var(--cyan);white-space:nowrap}
.stage{grid-area:stage;position:relative;min-height:0;overflow:hidden;background:#05070d}
#cv{position:absolute;inset:0;display:block;touch-action:manipulation}
.panel{grid-area:panel;min-height:0;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding-block:16px 28px;padding-inline:16px;display:flex;flex-direction:column;gap:14px}
.panel section{display:flex;flex-direction:column;gap:14px}
.ph h2{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.03em;margin:0;line-height:1.1;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:62ch}
.grp{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}
.grp>h3{margin:0;display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.grp>h3 em{font-style:normal;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--cyan)}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab,.ctl label{font-size:12.5px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
output{font-family:var(--mono);font-size:12.5px;color:var(--fg);font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;min-width:0;border:1px solid var(--line);background:var(--raise);border-radius:7px;padding:7px 8px;font-size:13px;cursor:pointer;color:var(--fg)}
.seg button.on{background:rgba(255,173,56,.14);border-color:var(--amber);color:var(--amber)}
.seg button:disabled{opacity:.38;cursor:not-allowed}
.seg.mono button{font-family:var(--mono);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--amber) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--amber) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--fg);border:3px solid var(--amber);margin-top:-7px}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--fg);border:3px solid var(--amber)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.12);cursor:pointer;padding:0}
.sw button.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--amber)}
.sw input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--raise);padding:2px;cursor:pointer}
.txt{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--fg);font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;width:100%}
.presets{display:flex;flex-wrap:wrap;gap:4px}
.presets button{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:5px 9px;font-size:12px;color:var(--muted);cursor:pointer}
.presets button:hover{color:var(--fg);border-color:var(--muted)}
.tip{border-radius:9px;padding:10px 12px;font-size:13px;background:rgba(108,212,232,.07);border:1px solid rgba(108,212,232,.25);color:#cfeef5}
.tip.warn{background:rgba(255,201,74,.07);border-color:rgba(255,201,74,.3);color:#ffe7ae}
.tip.crit{background:rgba(255,97,89,.08);border-color:rgba(255,97,89,.35);color:#ffc9c5}
.tip b{color:var(--fg)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--raise);border-radius:8px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:11.5px;color:var(--muted)}
.kv strong{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.motors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mcard{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:9px;padding:8px 10px;cursor:pointer;min-width:0}
.mcard .cls{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;width:24px;text-align:center;color:var(--amber)}
.mcard strong{display:block;font-family:var(--mono);font-size:13px}
.mcard small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard.on{border-color:var(--amber);background:rgba(255,173,56,.1)}
.mcard:disabled{opacity:.4;cursor:not-allowed}
.mcard:disabled .cls{color:var(--muted)}
.chart{width:100%;height:150px;display:block;background:var(--raise);border-radius:8px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--raise);cursor:pointer;color:var(--fg);font-size:13px}
.checks input{accent-color:var(--amber);width:18px;height:18px;flex:none;margin-top:1px}
.arm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0b101e}
.arm span{font-size:13px}
.key{width:58px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--raise);position:relative;cursor:pointer;flex:none}
.key::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s}
.key[aria-checked=true]{background:rgba(255,97,89,.25);border-color:var(--crit)}
.key[aria-checked=true]::after{transform:translateX(28px);background:var(--crit);box-shadow:0 0 10px var(--crit)}
.go{border:0;border-radius:12px;padding:15px;background:radial-gradient(circle at 50% 30%,#ff7a5c,#d22b1c);color:#fff;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.18em;cursor:pointer;box-shadow:0 6px 0 #7d140b,0 0 24px rgba(255,80,50,.35)}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #7d140b}
.go:disabled{background:var(--raise);color:var(--muted);box-shadow:none;cursor:not-allowed}
.why{font-size:12.5px;color:var(--muted);text-align:center;min-height:1em}
.missions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.missions li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--raise);font-size:13px}
.missions li i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:1px}
.missions li.done i{background:var(--good);border-color:var(--good)}
.missions li small{display:block;color:var(--muted);font-size:11.5px}
.missions li.new{outline:1px solid var(--good)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;border:1px solid var(--line);background:var(--raise);border-radius:9px;padding:11px 12px;cursor:pointer;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.05em}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.on{border-color:var(--cyan);color:var(--cyan)}
.verdict{display:flex;flex-direction:column;gap:4px}
.verdict .pill{align-self:flex-start}
.verdict h2{font-family:var(--display);font-size:30px;font-weight:800;margin:0;letter-spacing:.02em;line-height:1.05}
.score{font-family:var(--display);font-size:46px;font-weight:800;line-height:1;color:var(--amber)}
.score small{font-size:15px;color:var(--muted);letter-spacing:.08em;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.04em}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);background:rgba(92,207,138,.12)}
.pill.warn{color:var(--warn);background:rgba(255,201,74,.12)}
.pill.crit{color:var(--crit);background:rgba(255,97,89,.13)}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.readout{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.chip{background:rgba(9,13,23,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:5px 9px;display:flex;flex-direction:column;min-width:0}
.chip span{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.chip strong{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.chip .pill{padding:1px 7px;font-size:10.5px}
.hud{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hud .phase{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.14em;color:var(--amber)}
.hud .alt{font-family:var(--display);font-weight:800;font-size:54px;line-height:.9;text-shadow:0 2px 14px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.hud .alt small{font-size:20px;color:var(--muted);margin-left:4px}
.hud .sub{display:flex;gap:12px;font-family:var(--mono);font-size:12.5px;color:#cdd5e8;text-shadow:0 1px 6px #000;font-variant-numeric:tabular-nums}
.hud .sub b{color:var(--fg);font-weight:700}
.countdown{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--display);font-weight:800;font-size:min(34vw,180px);color:#fff;text-shadow:0 0 40px rgba(255,120,40,.7)}
.countdown span{animation:pulse 1s ease-out}
@keyframes pulse{from{transform:scale(1.5);opacity:.2}to{transform:scale(1);opacity:1}}
.toasts{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;width:calc(100% - 32px)}
.toast{background:rgba(9,13,23,.85);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;animation:tin .25s ease-out;max-width:100%;text-align:center}
.toast.crit{border-color:var(--crit);color:#ffd1cd}
.toast.good{border-color:var(--good)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.note{font-size:11.5px;color:var(--muted)}
.tools{display:flex;gap:6px}
.fbar{position:absolute;left:12px;right:52px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:none}
.fbar button{pointer-events:auto;background:rgba(9,13,23,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:8px 12px;font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.fbar button.on{border-color:var(--cyan);color:var(--cyan)}
kbd{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:1px 5px;border:1px solid rgba(255,255,255,.18);border-radius:4px;color:var(--muted);margin-left:7px;letter-spacing:0}
.keys{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}
.keys kbd{margin:0 3px 0 0}
#app.flying{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top" "stage"}
#app.flying .panel{display:none}
@media (max-width:979px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 54% minmax(0,1fr);grid-template-areas:"top" "stage" "panel"}
  .panel{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:600px){
  #app{grid-template-rows:auto 44% minmax(0,1fr)}
  .brand small{display:none}
  .steps{margin-left:0;order:3;width:100%}
  .steps button{flex:1 1 0;justify-content:center;padding:6px 6px;font-size:14px}
  .tools{margin-left:auto}
  .hud .alt{font-size:42px}
  .chip strong{font-size:13px}
  .fbar button{font-size:13.5px;padding:7px 9px}
}
@media (hover:none){kbd,.keys{display:none}}
@media (prefers-reduced-motion:reduce){.countdown span,.toast{animation:none}}
</style>

<div id="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><b>TRẠM PHÓNG K20</b><small>Mô phỏng tên lửa mô hình · Modellraketen</small></div></div>
    <nav class="steps" id="steps" aria-label="Các giai đoạn">
      <button data-step="design"><i>1</i>Thiết kế</button>
      <button data-step="motor"><i>2</i>Động cơ</button>
      <button data-step="recovery"><i>3</i>Thu hồi</button>
      <button data-step="launch"><i>4</i>Phóng</button>
    </nav>
    <div class="tools">
      <button class="icon-btn" id="gfx" aria-label="Chất lượng đồ họa" title="Chất lượng đồ họa"></button>
      <button class="icon-btn" id="fs" aria-label="Toàn màn hình" title="Toàn màn hình (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="icon-btn" id="snd" aria-label="Bật/tắt âm thanh" title="Âm thanh"></button>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Khung mô phỏng tên lửa"></canvas>
    <div class="readout" id="readout"></div>
    <div class="hud" id="hud" hidden>
      <div class="phase" id="hPhase">TĂNG TỐC</div>
      <div class="alt"><span id="hAlt">0</span><small>m</small></div>
      <div class="sub"><span>V <b id="hV">0</b> m/s</span><span>G <b id="hG">0</b></span><span>T+<b id="hT">0,0</b>s</span></div>
    </div>
    <div class="countdown" id="countdown" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="fbar" id="fbar" hidden></div>
  </main>
  <aside class="panel" id="panel">
    <section data-panel="design"></section>
    <section data-panel="motor" hidden></section>
    <section data-panel="recovery" hidden></section>
    <section data-panel="launch" hidden></section>
    <section data-panel="result" hidden></section>
  </aside>
</div>

function shape(type,u){
  if(u<0||u>1)return 0;
  if(type==='bp'){
    if(u<0.1)return 3.2*u/0.1;
    if(u<0.3)return 3.2-2.35*(u-0.1)/0.2;
    if(u<0.9)return 0.85-0.1*(u-0.3)/0.6;

function geom(d,rc){

    ['body',Math.PI*di*Lb*MATS_BODY[d.bodyMat].a*1.04,Ln+Lb/2],

    ['rec',rp.mass,Ln+0.18*Lb],

    }else{

    if(!s.apoDone&&s.vy<0){s.apoDone=true;ev(s,'apogee','Đỉnh bay '+Math.round(s.apo)+' m')}

  if(s.vEj==null&&!s.noLift)tips.push('Tên lửa chạm đất trước khi dù kịp bung. Giảm thời gian trễ.');

  if(lost)tips.push(`Trôi ${fmt(dist)} m, vượt ranh ${site.r} m. Nghiêng ray ngược gió, dùng dù nhỏ hoặc dải băng.`);
  if(!tips.length)tips.push('Thiết kế rất ổn. Thử động cơ hạng cao hơn hoặc tối ưu khí động để bay cao hơn.');
  const p=$('[data-panel=result]');p.innerHTML='';

  const kv=kvBox();setKV(kv,[['Đỉnh bay',fmt(r.apogee)+' m'],['Vận tốc tối đa',fmt(r.maxV)+' m/s'],['Gia tốc tối đa',fmt(r.maxG,1)+' g'],['Rời ray',r.railV!=null?fmt(r.railV,1)+' m/s':'—'],['Bung ở',r.vEj!=null?fmt(r.vEj,1)+' m/s':'—'],['Chạm đất',s.noLift?'—':fmt(r.landV,1)+' m/s'],['Trôi dạt',fmt(dist)+' m'],['Thời gian bay',fmt(r.tFlight,1)+' s']]);

  p.append(grp('Nhận xét kỹ sư','Analyse',[el('ul','list',tips.map(x=>`<li>${x}</li>`).join(''))]));

  const b=el('div','btns'),b1=el('button','btn pri','Phóng lại'),b2=el('button','btn','Sửa thiết kế');b1.type=b2.type='button';
  b1.innerHTML='Phóng lại<kbd>R</kbd>';b1.onclick=relaunch;b2.onclick=()=>{armed=false;setStep('design')};b.append(b1,b2);p.append(b);
  $('#app').classList.remove('flying');$('#fbar').hidden=true;$('#readout').hidden=true;$$('#steps button').forEach(x=>x.disabled=false);$$('.panel section').forEach(x=>x.hidden=x.dataset.panel!=='result');$('#panel').scrollTop=0;
  mode='result';renderMissions(fresh);
  requestAnimationFrame(()=>drawFlightChart(chart,s));
  binders.forEach(f=>f());
}
function drawFlightChart(c,s){const dp=Math.min(2,devicePixelRatio||1),W=c.clientWidth,H=c.clientHeight;if(!W)return;c.width=W*dp;c.height=H*dp;const x=c.getContext('2d');x.setTransform(dp,0,0,dp,0,0);
  const L=s.log;if(L.length<2)return;const tmax=L[L.length-1][0],amax=Math.max(1,...L.map(p=>p[1]))*1.1,vmax=Math.max(1,...L.map(p=>p[2]))*1.1;
  const l=38,r=38,t=14,b=22,pw=W-l-r,ph=H-t-b;x.font='500 10px "JetBrains Mono",monospace';x.lineWidth=1;
  const as=niceStep(amax/4);for(let a=0;a<=amax;a+=as){const y=t+ph-a/amax*ph;x.strokeStyle='rgba(255,255,255,.06)';x.beginPath();x.moveTo(l,y);x.lineTo(W-r,y);x.stroke();x.fillStyle='#6cd4e8';x.textAlign='right';x.fillText(fmt(a),l-5,y+3)}
  const vs=niceStep(vmax/4);x.textAlign='left';x.fillStyle='#ffad38';for(let v=0;v<=vmax;v+=vs){x.fillText(fmt(v),W-r+5,t+ph-v/vmax*ph+3)}
  const ts=niceStep(tmax/5);x.fillStyle='#8e9aba';x.textAlign='center';for(let q=0;q<=tmax;q+=ts)x.fillText(fmt(q)+'s',l+q/tmax*pw,H-6);
  const line=(i,mx,col,fill)=>{x.beginPath();L.forEach((p,j)=>{const px=l+p[0]/tmax*pw,py=t+ph-p[i]/mx*ph;j?x.lineTo(px,py):x.moveTo(px,py)});if(fill){x.lineTo(l+pw,t+ph);x.lineTo(l,t+ph);x.closePath();const g=x.createLinearGradient(0,t,0,t+ph);g.addColorStop(0,'rgba(108,212,232,.3)');g.addColorStop(1,'rgba(108,212,232,0)');x.fillStyle=g;x.fill()}else{x.strokeStyle=col;x.lineWidth=2;x.stroke()}};
  line(1,amax,0,1);line(1,amax,'#6cd4e8');line(2,vmax,'#ffad38');
  const ai=L.reduce((bi,p,i)=>p[1]>L[bi][1]?i:bi,0),[at,ah]=L[ai];const px=l+at/tmax*pw,py=t+ph-ah/amax*ph;x.fillStyle='#6cd4e8';x.beginPath();x.arc(px,py,4,0,TAU);x.fill();
  x.font='600 10.5px "JetBrains Mono",monospace';x.textAlign='left';x.fillStyle='#6cd4e8';x.fillText('— độ cao (m)',l+6,t+10);x.fillStyle='#ffad38';x.fillText('— vận tốc (m/s)',l+100,t+10)}

function frame(now){const raw=(now-last)/1000,dt=Math.min(0.05,raw);last=now;tNow+=dt;perfTick(raw);fdt=dt;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality=qLite()?'low':'high';
  if(cd){cd.t-=dt;const n=Math.ceil(cd.t);if(n!==cd.last&&n>0){cd.last=n;$('#countdown').innerHTML=`<span>${n}</span>`;tone(n===1?1040:780,0.12,'square',0.07)}
    if(cd.t<=0){cd=null;$('#countdown').innerHTML='<span>0</span>';ign={t:0};tone(2200,0.05,'square',0.05);paintF()}}
  if(ign){ign.t+=dt;const pp=padPose();for(let i=0;i<Math.ceil(dt*90);i++){const a=Math.PI/2+(Math.random()-0.5)*2.6,v=(80+Math.random()*200)/cam.scale;emit('spark',pp.x,pp.y,Math.cos(a)*v,-Math.abs(Math.sin(a))*v*0.4,0.2+Math.random()*0.3,0,0)}
    if(Math.random()<dt*20)tone(1800+Math.random()*1800,0.02,'square',0.03);

  ets=1;

  }
